name: Daily Digest

on:
  schedule:
    - cron: "0 14 * * *" # 7 AM PT
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate GitHub token
        env:
          DIGEST_GITHUB_TOKEN: ${{ secrets.DIGEST_GITHUB_TOKEN }}
        run: |
          if [ -z "$DIGEST_GITHUB_TOKEN" ]; then
            echo "::error::DIGEST_GITHUB_TOKEN is not set. Add a GitHub PAT (repo, read:org) under Settings → Secrets → Actions."
            exit 1
          fi
          echo "DIGEST_GITHUB_TOKEN is present."

      - name: Scan repositories
        run: npm run scan:repos
        env:
          GITHUB_TOKEN: ${{ secrets.DIGEST_GITHUB_TOKEN }}

      - name: Send AI digest email
        env:
          GITHUB_TOKEN: ${{ secrets.DIGEST_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASS" ] || [ -z "$EMAIL_TO" ]; then
            echo "::warning::Repository scan completed. Email digest skipped — add ANTHROPIC_API_KEY, SMTP_USER, SMTP_PASS, and EMAIL_TO to enable outbound mail."
            exit 0
          fi
          node -e "import('./src/index.js').then(m => m.runDigest())"
